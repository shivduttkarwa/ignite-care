upstream ignite_api {
    server unix:/run/ignite/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name portal.example.com.au;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.example.com.au;

    ssl_certificate     /etc/letsencrypt/live/portal.example.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.example.com.au/privkey.pem;

    client_max_body_size 5m;
    root /srv/ignite/web;

    location ~ ^/(api|django-admin)/ {
        proxy_pass http://ignite_api;
        proxy_set_header Host $host;
        # Overwrite, don't append: login lockout keys on this header, so a client must not be able to set it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    location /static/ {
        alias /srv/ignite/app/staticfiles/;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
        access_log off;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
