{% load care %}
<div class="c-field" x-data="repeater({
       rows: {{ attendances_json }},
       blank: { time: '', purpose: '', duration_minutes: '' }
     })">
  <p class="c-field__label">
    {% field_label field participant %}
  </p>
  {% if field.help %}<p class="c-field__help">{{ field.help }}</p>{% endif %}

  <div class="c-repeater">
    <template x-for="(row, index) in rows" :key="index">
      <div class="c-repeater__row">
        <input class="c-input c-input--time" type="time" name="attendance_time"
               :aria-label="'Attendance ' + (index + 1) + ' time'"
               x-model="row.time">
        <input class="c-input" type="text" name="attendance_purpose" placeholder="Purpose"
               :aria-label="'Attendance ' + (index + 1) + ' purpose'"
               x-model="row.purpose">
        <input class="c-input" type="number" inputmode="numeric" name="attendance_duration"
               placeholder="min" min="1" max="480"
               :aria-label="'Attendance ' + (index + 1) + ' duration in minutes'"
               x-model="row.duration_minutes">
        <button type="button" class="c-repeater__remove" @click="remove(index)"
                :aria-label="'Remove attendance ' + (index + 1)">
          <svg aria-hidden="true"><use href="#i-trash"></use></svg>
        </button>
      </div>
    </template>

    <button type="button" class="c-repeater__add" @click="add()">
      <svg style="width:1rem;height:1rem" aria-hidden="true"><use href="#i-plus"></use></svg>
      {{ field.add_label|default:"Add row" }}
    </button>
  </div>
</div>
