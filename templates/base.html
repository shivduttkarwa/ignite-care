{% load static %}<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#115E74">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}{{ organisation_name }}{% endblock %}</title>

  <link rel="preload" href="{% static 'fonts/barlow-400.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{% static 'fonts/barlow-600.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{% static 'fonts/barlow-condensed-600.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="manifest" href="{% static 'manifest.webmanifest' %}">
  <link rel="icon" href="{% static 'img/favicon-32.png' %}" sizes="32x32">
  <link rel="apple-touch-icon" href="{% static 'img/icon-192.png' %}">

  <script src="{% static 'js/vendor/htmx.min.js' %}" defer></script>
  <script src="{% static 'js/app.js' %}" defer></script>
  <script src="{% static 'js/vendor/alpine.min.js' %}" defer></script>
</head>
<body hx-boost="true">
  <a class="u-skip" href="#main">Skip to content</a>
  {% include "partials/_icons.html" %}

  {% block body %}{% endblock %}

  {% block scripts %}{% endblock %}
</body>
</html>
